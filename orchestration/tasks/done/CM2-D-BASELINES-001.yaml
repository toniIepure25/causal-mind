- all of B0-B7 implemented
- every baseline evaluated under the frozen protocol
- baseline scores persisted with seeds
failure_criteria:
- a baseline uses test-subject information
- a baseline is missing
deliverables: [src/causal_mind/forecast/baselines.py, tests/test_baselines.py]
assigned_worker: forecasting
state: done
result: B0-B7 implemented; strongest B2/B3 markov 0.3265
