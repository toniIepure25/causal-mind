name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One concurrent run per ref; cancel superseded in-progress runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: One-command validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      # Mirror scripts/bootstrap_environment.sh: core + dev + neural.
      - name: Install environment
        run: uv sync --extra neural

      # The single command a collaborator runs to confirm the project is healthy.
      - name: Run one-command validation
        run: bash scripts/validate_project.sh
        env:
          HF_HOME: ${{ runner.temp }}/hf-home
